<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">Crear Cuenta</h2>

    <form class="auth-form" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          [(ngModel)]="nombre_completo" 
          placeholder="Juan Pérez" 
          class="form-input" 
          required>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="usuario@correo.com" 
          class="form-input" 
          required>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input 
          type="tel" 
          id="telefono" 
          name="telefono" 
          [(ngModel)]="telefono" 
          placeholder="12345678" 
          class="form-input" 
          required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password_hash" 
          placeholder="••••••••" 
          class="form-input" 
          required>
      </div>

      <!-- Alerta de Errores detallados para el Usuario -->
      <div *ngIf="erroresLista().length > 0" class="error-container">
        <ul>
          <li *ngFor="let err of erroresLista()">{{ err }}</li>
        </ul>
      </div>

      <button type="submit" class="btn-primary" [disabled]="cargando()">
        {{ cargando() ? 'Registrando...' : 'Crear Cuenta' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
