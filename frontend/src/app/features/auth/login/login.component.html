<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">Iniciar Sesión</h2>

    <form class="auth-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="ejemplo@correo.com" 
          class="form-input" 
          required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password_hash" 
          placeholder="••••••••" 
          class="form-input" 
          required>
      </div>
      <button type="submit" [disabled]="cargando()">
    {{ cargando() ? 'Cargando...' : 'Iniciar Sesión' }}
  </button>

      <!-- Alerta visual si ocurre un fallo 401 o de credenciales -->
      <div *ngIf="errorMsg()" class="error-container">
        {{ errorMsg() }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a>
    </p>
  </div>
</div>
