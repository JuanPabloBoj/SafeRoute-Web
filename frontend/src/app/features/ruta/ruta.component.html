<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Rutas Seguras</h1>
    <a routerLink="/rutas-seguras/nueva" class="btn-success">+ Nueva Ruta</a>
  </div>

  <div *ngIf="cargando()" class="loading">Cargando rutas trazadas...</div>

  <div *ngIf="!cargando()" class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Ruta</th>
          <th>Coordenadas Origen</th>
          <th>Coordenadas Destino</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of rutas()">
          <td>{{ r.nombre }}</td>
          <td>{{ r.origen_lat }}, {{ r.origen_lng }}</td>
          <td>{{ r.destino_lat }}, {{ r.destino_lng }}</td>
          <td>
            <a [routerLink]="['/rutas-seguras/editar', r.id]" class="btn-link">Editar</a>
          </td>
        </tr>
        <tr *ngIf="rutas().length === 0">
          <td colspan="4" class="empty-cell">No hay rutas seguras creadas.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
