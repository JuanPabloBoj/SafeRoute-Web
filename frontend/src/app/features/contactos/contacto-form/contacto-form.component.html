<div class="form-container">
  <h1 class="form-title">Gestión de Contacto</h1>
  <form class="card-form">
    <div class="form-group">
      <label for="nombre">Nombre Completo</label>
      <input type="text" id="nombre" class="form-input">
    </div>
    <div class="form-group">
      <label for="relacion">Relación / Parentesco</label>
      <input type="text" id="relacion" class="form-input">
    </div>
    <div class="form-group">
      <label for="telefono">Número Telefónico</label>
      <input type="tel" id="telefono" class="form-input">
    </div>
    <div class="form-actions">
      <a routerLink="/contactos" class="btn-cancel">Cancelar</a>
      <button type="submit" class="btn-save">Guardar</button>
    </div>
  </form>
</div>
