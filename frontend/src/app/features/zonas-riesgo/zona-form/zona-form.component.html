<div class="form-container">
  <h1 class="form-title">Registrar / Editar Zona</h1>
  <form class="card-form">
    <div class="form-group">
      <label for="nombre">Nombre de la Zona</label>
      <input type="text" id="nombre" class="form-input">
    </div>
    <div class="form-group">
      <label for="nivel">Nivel de Riesgo</label>
      <select id="nivel" class="form-input">
        <option value="BAJO">Bajo</option>
        <option value="MEDIO">Medio</option>
        <option value="ALTO">Alto</option>
      </select>
    </div>
    <div class="form-actions">
      <a routerLink="/zonas-riesgo" class="btn-cancel">Cancelar</a>
      <button type="submit" class="btn-save">Guardar</button>
    </div>
  </form>
</div>
